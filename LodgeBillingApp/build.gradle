plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.lodge'
version = '1.0'

repositories {
    mavenCentral()
}

javafx {
    version = "21.0.4"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.base' ]
}

application {
    mainClass = 'com.lodge.MainApp'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}